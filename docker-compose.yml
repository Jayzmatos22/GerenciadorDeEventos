# Sobe apenas o PostgreSQL para desenvolvimento local (secao 10 da especificacao).
services:
  postgres:
    image: postgres:16-alpine
    container_name: eventos-postgres
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - eventos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventos-pgdata:

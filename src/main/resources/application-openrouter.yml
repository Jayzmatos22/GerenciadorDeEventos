# Perfil OpenRouter: um unico gateway para modelos hospedados de varios fornecedores.
#
# Nao ha starter proprio nem precisa: a API do OpenRouter e compativel com a da OpenAI, entao
# o starter que ja existe no projeto serve, bastando trocar a base-url. A troca de provedor
# continua sendo so de propriedade, como manda a secao 8 da especificacao.
#
# Para subir:
#   $env:OPENROUTER_API_KEY = "sk-or-v1-..."   (PowerShell)
#   export OPENROUTER_API_KEY="sk-or-v1-..."   (Linux e macOS)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=openrouter
#
# Se a chave faltar ou o modelo recusar, a extracao devolve 503 IA_INDISPONIVEL e o cadastro
# manual segue funcionando (RN-10). Nada quebra por causa disso.
spring:
  ai:
    model:
      chat: openai
    openai:
      # O /v1 faz parte da base-url, nao e acrescentado pelo Spring AI. O 2.x delega ao SDK
      # oficial da OpenAI, cujo padrao e https://api.openai.com/v1 - ele so concatena
      # /chat/completions ao que vier aqui. Sem o /v1 a chamada vira .../api/chat/completions
      # e o OpenRouter responde 404.
      base-url: ${OPENROUTER_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          # O padrao aponta para um modelo PAGO, de proposito.
          #
          # O OpenRouter tem variantes gratuitas, com sufixo :free, mas elas entram e saem do
          # catalogo: a deste mesmo modelo foi descontinuada e passou a responder 404 dizendo
          # "use the paid version". Fixar um slug gratuito aqui significa entregar um projeto
          # que quebra sozinho quando a lista muda, e com um erro que parece defeito de
          # configuracao.
          #
          # Para usar uma variante gratuita, escolha uma que exista hoje no catalogo e defina
          # OPENROUTER_MODEL no .env. O custo deste padrao e irrisorio para o uso do projeto:
          # uma extracao gasta cerca de 500 tokens de entrada e 150 de saida.
          #
          # Quando a chamada falha, o motivo real (401 chave, 402 credito, 404 modelo) sai no
          # log em WARN; o cliente ve sempre 503 IA_INDISPONIVEL, por desenho da RN-10.
          model: ${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct}
          temperature: 0.2

app:
  ia:
    # Rotacao de modelos gratuitos. Os endpoints :free do OpenRouter sao capacidade
    # compartilhada entre todos os usuarios do gateway, entao recusam com 429 ("Provider
    # returned error") mesmo na primeira requisicao da conta - ter varios na lista e o que
    # torna o modo gratuito usavel.
    #
    # A lista fica no .env e nao aqui de proposito: slug gratuito e dado que muda. Para montar
    # a sua a partir do catalogo de hoje, ver o README (secao do OpenRouter).
    modelos: ${OPENROUTER_MODELOS:}

logging:
  level:
    br.unisa.eventos.ia: DEBUG

# Cabeçalhos de segurança do documento.
#
# Ficam num arquivo à parte por causa de uma regra do nginx que morde fácil: um `location`
# que declara o próprio `add_header` deixa de herdar os do nível acima — todos eles. Como
# `/` cai em `/index.html` por `try_files`, e esse bloco define o seu próprio Cache-Control,
# os cabeçalhos definidos só no `server` sumiam justamente da página HTML, que é onde mais
# importam. Daí o `include` repetido em cada bloco que tem `add_header` próprio.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# O bundle do Vite não usa script inline, então script-src pode ser estrito. O
# 'unsafe-inline' em style-src cobre os estilos que o React aplica via atributo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

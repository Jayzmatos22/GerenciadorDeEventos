server {
    listen 80;
    server_name _;

    # DNS interno do Docker. Resolver o backend a cada requisição, e não na subida, é o que
    # permite ao nginx iniciar antes do backend existir e acompanhar uma troca de IP quando o
    # contêiner reinicia. Sem isto o nginx morre no boot com "host not found in upstream".
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os arquivos do Vite têm hash no nome, então podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca é cacheado: é ele que aponta para os arquivos com hash novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A API e as fotos vão para o backend. Mesma origem, logo não há CORS em produção.
    location /api/ {
        # Com variável no proxy_pass o nginx não acrescenta o caminho sozinho: daí o
        # $request_uri explícito, que já inclui a query string.
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O PDF do certificado é gerado sob demanda; não vale bufferizar nem cachear.
        proxy_buffering off;
        client_max_body_size 10m;
    }

    location /uploads/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Rotas do React Router são resolvidas no cliente: qualquer caminho desconhecido devolve
    # o index.html em vez de 404, senão recarregar a página em /organizador quebraria.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

h="1.1"/><polyline points="606,560 606,574 620,574" fill="none" stroke="#9aa3ae" stroke-width="1.1"/><text x="72.0" y="580.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#9aa3ae" text-anchor="start">Presença e certificado não são estados: são registros ligados</text><text x="72.0" y="596.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#9aa3ae" text-anchor="start">a uma inscrição CONFIRMADA (RN-05).</text><text x="72.0" y="612.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#9aa3ae" text-anchor="start">AUSENTE existe no enum, mas nenhum fluxo da versão atual o grava.</text><text x="72.0" y="628.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#9aa3ae" text-anchor="start">Reinscrever-se depois de cancelar cria uma nova inscrição (RN-03).</text><rect x="306.7" y="39.0" width="190.0" height="16" fill="#17181b"/><text x="401.7" y="51.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#eceff4" text-anchor="middle">inscrever [evento lotado] · RN-01</text><rect x="640.1" y="39.0" width="156.3" height="16" fill="#17181b"/><text x="718.3" y="51.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#eceff4" text-anchor="middle">inscrever [há vaga] · RN-01</text><rect x="466.1" y="207.0" width="187.7" height="16" fill="#17181b"/><text x="560.0" y="219.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#eceff4" text-anchor="middle">promover [vaga liberada] · RN-02</text><rect x="219.6" y="405.2" width="100.8" height="16" fill="#17181b"/><text x="270.0" y="417.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#ecef